<script>
(function () {
  var LANDING = 'https://exponenta.store/whey/detail/';
  // счётчики креатива, которые в демо не нужны
  var BLOCK = /(^|\.)weborama-tech\.ru$|^pixels\.getshop\.tv$|^vod-super\.getshop\.tv$|^voncat\.getshop\.tv$/i;
  var blockedLog = window.__demoBlocked = [];
  function hostOf(u) { try { return new URL(String(u), location.href).hostname; } catch (e) { return ''; } }
  function isBlocked(u) { return BLOCK.test(hostOf(u)); }

  // <img>-пиксели
  var imgSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  Object.defineProperty(HTMLImageElement.prototype, 'src', {
    configurable: true, enumerable: imgSrc.enumerable, get: imgSrc.get,
    set: function (v) { if (isBlocked(v)) { blockedLog.push(String(v)); return; } imgSrc.set.call(this, v); }
  });
  // стили креатива — по адресу с версией: CDN getshop после перевыкладки какое-то время отдаёт старый index.css,
  // а браузер кэширует его на 10 минут — раскладка креатива тогда разваливается
  var ASSET_VER = '20261120';
  function fresh(u) { var s = String(u); return /getshop\.tv\/.*\/index\.css$/i.test(s) ? s + '?v=' + ASSET_VER : s; }
  var linkHref = Object.getOwnPropertyDescriptor(HTMLLinkElement.prototype, 'href');
  Object.defineProperty(HTMLLinkElement.prototype, 'href', {
    configurable: true, enumerable: linkHref.enumerable, get: linkHref.get,
    set: function (v) { linkHref.set.call(this, fresh(v)); }
  });
  var setAttr = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (name, value) {
    var n = String(name).toLowerCase();
    if (n === 'src' && isBlocked(value)) { blockedLog.push(String(value)); return; }
    if (n === 'href' && this instanceof HTMLLinkElement) { return setAttr.call(this, name, fresh(value)); }
    return setAttr.apply(this, arguments);
  };

  // fetch / sendBeacon
  var origFetch = window.fetch;
  window.fetch = function (input) {
    var u = input && input.url ? input.url : input;
    if (isBlocked(u)) {
      blockedLog.push(String(u));
      return Promise.resolve(new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    return origFetch.apply(this, arguments);
  };
  if (navigator.sendBeacon) {
    var origBeacon = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function (u) { if (isBlocked(u)) { blockedLog.push(String(u)); return true; } return origBeacon.apply(null, arguments); };
  }

  // переход — сразу на сайт, без счётчика клика (в staging-сборке getads клик ведёт на заглушку example.com)
  var origOpen = window.open;
  window.open = function (u) {
    if (u && (isBlocked(u) || /(^|\.)example\.com$/i.test(hostOf(u)))) { blockedLog.push(String(u)); return origOpen.call(window, LANDING, '_blank', 'noopener'); }
    return origOpen.apply(window, arguments);
  };
})();
</script>

<script>
(function () {
  var stage = document.getElementById('stage');
  var adSlot = document.getElementById('adSlot');
  var videoSlot = document.getElementById('videoSlot');
  var startCover = document.getElementById('startCover');
  var loadingCover = document.getElementById('loadingCover');
  var endCover = document.getElementById('endCover');
  var vpaid = null, started = false, finished = false;

  function size() { return [Math.round(stage.clientWidth), Math.round(stage.clientHeight)]; }
  function finish() {
    if (finished) return;
    finished = true;
    loadingCover.hidden = true;
    // ролик так и не пошёл (сбой CDN, сеть) — честно говорим и даём перезапуск
    if (videoSlot.currentTime < 1) endCover.querySelector('p').hidden = false;
    endCover.hidden = false;
  }

  function start() {
    if (vpaid) return;
    startCover.hidden = true;
    loadingCover.hidden = false;

    if (typeof window.getVPAIDAd !== 'function') {
      loadingCover.innerHTML = '<p>Креатив не загрузился. Проверьте подключение к интернету и обновите страницу.</p>';
      return;
    }
    vpaid = window.getVPAIDAd();
    vpaid.subscribe(function () { loadingCover.hidden = true; started = true; vpaid.startAd(); }, 'AdLoaded');
    vpaid.subscribe(finish, 'AdStopped');
    vpaid.subscribe(finish, 'AdSkipped');
    vpaid.subscribe(function (e) { console.warn('AdError', e); finish(); }, 'AdError');

    var wh = size();
    vpaid.initAd(wh[0], wh[1], 'normal', 0,
      { AdParameters: JSON.stringify({ EXPAND_BUTTON_KEY_CODE: 13, displayErid: false, ycp: 'demo' }) },
      { slot: adSlot, videoSlot: videoSlot, videoSlotCanAutoPlay: true });
  }

  startCover.addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', function () { location.reload(); });

  var recInfo = document.getElementById('recInfo');
  new ResizeObserver(function () {
    var wh = size();
    if (vpaid && started && !finished) { try { vpaid.resizeAd(wh[0], wh[1], 'normal'); } catch (e) {} }
    if (document.documentElement.classList.contains('rec')) {
      recInfo.textContent = 'Кадр ' + wh[0] + ' × ' + wh[1] + ' — выделите область внутри пунктира: ⇧⌘5 → «Записать выбранную область»';
    }
  }).observe(stage);

  document.addEventListener('visibilitychange', function () {
    if (!vpaid || !started || finished) return;
    try { document.hidden ? vpaid.pauseAd() : vpaid.resumeAd(); } catch (e) {}
  });
})();
</script>
